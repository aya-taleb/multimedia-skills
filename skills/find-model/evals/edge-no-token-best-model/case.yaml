schema_version: "1.1"
name: edge-no-token-best-model
expected_outcome: |
  No provider key is set (no Replicate, Cloudflare, OpenAI, Runway or Gemini key). The assistant does not name a 'best' model from memory as fact. It explains that models change fast so it checks live, explains how to set up a key for an account the user already has or offers the public search link, and asks what the video is for. If it shows rows from the dated price table, it labels them with their checked date and does not call one the best. No paid runs.
