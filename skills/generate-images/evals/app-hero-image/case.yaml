name: app-hero-image
expected_outcome: |
  The assistant reads founder/context.md, checks the token, finds a current image model with a live search instead of naming one from memory, reads its schema, writes a full-sentence prompt that fits the brand, and does a dry run that prints the price. It shows the model, prompt, size and dollar estimate and asks for a yes. It does not start a paid prediction, because the user has not seen or approved a price.
